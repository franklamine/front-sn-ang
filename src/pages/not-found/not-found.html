<div class="min-h-screen flex items-center justify-center bg-gray-100 px-4">

  <div class="bg-white shadow-lg rounded-xl p-8 max-w-md w-full text-center">

    <!-- Icône -->
    <div class="flex justify-center mb-6">
      <div class="bg-blue-100 text-blue-500 p-4 rounded-full">
        <svg lucideSearch class="w-8 h-8" ></svg>
      </div>
    </div>

    <!-- Titre -->
    <h1 class="text-5xl font-bold text-gray-800 mb-2">404</h1>

    <h2 class="text-xl font-semibold text-gray-700 mb-4">
      Page introuvable
    </h2>

    <!-- Texte -->
    <p class="text-gray-500 mb-6">
      Oups 😅 La page que vous cherchez n’existe pas ou a été déplacée.
    </p>

    <!-- Boutons -->
    <div class="flex flex-col sm:flex-row gap-4 justify-center">

      <button
        (click)="goHome()"
        class="flex items-center justify-center gap-2 bg-blue-500 hover:bg-blue-600 text-white px-6 py-3 rounded-lg transition duration-200">
        <svg lucideHome class="w-5 h-5"></svg>
        Accueil

      </button>

      <button
        (click)="goBack()"
        class="px-6 py-3 rounded-lg border border-gray-300 text-gray-600 hover:bg-gray-100 transition duration-200">

        Retour

      </button>

    </div>

  </div>

</div>
