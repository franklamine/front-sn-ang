<nav
  class="fixed top-0 w-full h-16 bg-white shadow-sm z-30 flex items-center justify-between px-4">

  <!-- GAUCHE : LOGO + RECHERCHE -->
  <div class="flex items-center gap-3">

    <a routerLink="/home">
      <img class="w-10 h-10 rounded-full object-cover hover:opacity-90 transition" src="/favicon.ico" alt="Logo" />
    </a>

    <div
      class="flex items-center bg-gray-100 hover:bg-gray-200 focus-within:bg-white focus-within:ring-2 focus-within:ring-blue-100 rounded-full px-3 py-2 gap-2 text-gray-500 transition">
      <svg lucideSearch class="w-4 h-4 shrink-0"></svg>
      <input type="text" placeholder="Search..."
             class="hidden md:block bg-transparent outline-none border-none w-40 text-sm text-gray-700 placeholder:text-gray-400" />
    </div>

  </div>


  <!-- CENTRE : NAVIGATION -->
  <div
    class="hidden md:flex absolute left-1/2 -translate-x-1/2 items-center text-gray-500">

    <!-- HOME -->
    <a
      routerLink="/home"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      aria-label="Home"
      class="relative group cursor-pointer hover:bg-gray-100 py-3 px-6 lg:px-10 rounded-xl transition duration-200">
      <svg lucideHouse class="w-8 h-8"></svg>
      <span
        class="absolute left-1/2 -translate-x-1/2 top-full mt-2 text-sm bg-gray-800 text-white px-3 py-1.5 rounded-lg opacity-0 group-hover:opacity-100 transition duration-200 whitespace-nowrap z-50 shadow-lg pointer-events-none">
        Home
      </span>
      <hr class="absolute bottom-0 left-1/2 -translate-x-1/2 w-16 lg:w-24 h-1 bg-blue-500 hidden rounded-full" />
    </a>


    <!-- FRIENDS -->
    <a
      routerLink="/friends"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      aria-label="Friends"
      class="relative group cursor-pointer hover:bg-gray-100 py-3 px-6 lg:px-10 rounded-xl  transition duration-200">
      <svg lucideUsers class="w-8 h-8"></svg>
      <span
        class="absolute left-1/2 -translate-x-1/2 top-full mt-2 text-sm bg-gray-800 text-white px-3 py-1.5 rounded-lg opacity-0 group-hover:opacity-100 transition duration-200 whitespace-nowrap z-50 shadow-lg pointer-events-none">
        Friends
      </span>
      <hr class="absolute bottom-0 left-1/2 -translate-x-1/2 w-16 lg:w-24 h-1 bg-blue-500 hidden rounded-full" />
    </a>


    <!-- VIDEO -->
    <a
      routerLink="/video"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      aria-label="Video"
      class="relative group cursor-pointer hover:bg-gray-100 py-3 px-6 lg:px-10 rounded-xl transition duration-200">
      <svg lucideVideo class="w-8 h-8"></svg>
      <span
        class="absolute left-1/2 -translate-x-1/2 top-full mt-2 text-sm bg-gray-800 text-white px-3 py-1.5 rounded-lg opacity-0 group-hover:opacity-100 transition duration-200 whitespace-nowrap z-50 shadow-lg pointer-events-none">
        Video
      </span>
      <hr class="absolute bottom-0 left-1/2 -translate-x-1/2 w-16 lg:w-24 h-1 bg-blue-500 hidden rounded-full" />
    </a>


    <!-- GAMING -->
    <a
      routerLink="/game"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      aria-label="Gaming"
      class="relative group cursor-pointer hover:bg-gray-100 py-3 px-6 lg:px-10 rounded-xl transition duration-200">
      <svg lucideGamepad2 class="w-8 h-8"></svg>
      <span
        class="absolute left-1/2 -translate-x-1/2 top-full mt- text-sm bg-gray-800 text-white px-3 py-1.5 rounded-lg opacity-0 group-hover:opacity-100 transition duration-200 whitespace-nowrap z-50 shadow-lg pointer-events-none">
        Gaming
      </span>
      <hr class="absolute bottom-0 left-1/2 -translate-x-1/2 w-16 lg:w-24 h-1 bg-blue-500 hidden rounded-full" />
    </a>

  </div>


  <!-- DROITE : ACTIONS + PROFIL -->
  <div class="flex items-center gap-2 md:gap-3 text-gray-600">

    <!-- MENU -->
    <button
      type="button"
      aria-label="Menu"
      class="relative group bg-gray-100 hover:bg-gray-200 rounded-full p-3 cursor-pointer transition duration-200">
      <svg lucideMenu class="w-5 h-5"></svg>
      <span
        class="absolute left-1/2 -translate-x-1/2 top-full mt-2 text-sm bg-gray-800 text-white px-3 py-1.5 rounded-lg opacity-0 group-hover:opacity-100 transition whitespace-nowrap z-50 shadow-lg pointer-events-none">
        Menu
      </span>
    </button>


    <!-- MESSAGES -->
    <button type="button" aria-label="Messages"
            class="relative group bg-gray-100 hover:bg-gray-200 rounded-full p-3 cursor-pointer transition duration-200">
      <svg lucideMessageCircle class="w-5 h-5"></svg>
      <span
        class="absolute left-1/2 -translate-x-1/2 top-full mt-2 text-sm bg-gray-800 text-white px-3 py-1.5 rounded-lg opacity-0 group-hover:opacity-100 transition whitespace-nowrap z-50 shadow-lg pointer-events-none">
        Messages
      </span>
    </button>


    <!-- NOTIFICATIONS -->
    <button
      type="button"
      aria-label="Notifications"
      class="relative group bg-gray-100 hover:bg-gray-200 rounded-full p-3 cursor-pointer transition duration-200">
      <svg lucideBell class="w-5 h-5"></svg>
      <span
        class="absolute left-1/2 -translate-x-1/2 top-full mt-2 text-sm bg-gray-800 text-white px-3 py-1.5 rounded-lg opacity-0 group-hover:opacity-100 transition whitespace-nowrap z-50 shadow-lg pointer-events-none">
        Notifications
      </span>
    </button>


    <!-- PROFIL -->
    <button
      type="button"
      aria-label="Mon profil"
      class="relative group rounded-full cursor-pointer ring-2 ring-transparent hover:ring-blue-400 transition duration-200">
      <img src="" alt="Profile" class="w-10 h-10 rounded-full object-cover" />
      <span
        class="absolute left-1/2 -translate-x-1/2 top-full mt-2text-sm bg-gray-800 text-white px-3 py-1.5 rounded-lg opacity-0 group-hover:opacity-100 transition whitespace-nowrap z-50 shadow-lgpointer-events-none">
        Account
      </span>
    </button>

  </div>

</nav>
